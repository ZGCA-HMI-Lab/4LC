[tool.pytest.ini_options]
testpaths = ["tests", "alc/tests"]
pythonpath = [
    "third_party/vjepa2",
    "third_party",
    "third_party/vggt",
    ".",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["third_party", "refer", "outputs", "local-assets", "build"]

[tool.ruff.lint]
select = ["E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
files = [
    "alc_video/inference/config.py",
    "alc_video/inference/cli.py",
    "alc_video/models/config.py",
    "alc_video/runtime/profiles.py",
    "alc_video/encoders/config.py",
    "alc_video/encoders/registry.py",
    "alc_video/training/config.py",
    "alc_video/data/config.py",
    "alc_video/utils/config.py",
    "alc_video/utils/errors.py",
]
mypy_path = "alc/src"
follow_imports = "silent"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
